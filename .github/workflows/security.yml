# Security scanning: runs on a weekly schedule and on every push to main.
# Two independent jobs: CodeQL (source code) and pip-audit (dependencies).

name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 09:00 UTC — keeps you informed even when no code changes
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write  # required to upload SARIF results to GitHub Security tab

jobs:
  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # CodeQL initializes a database by tracing your code as it runs
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          languages: python

      # For Python, CodeQL can auto-build; no explicit build step needed
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          category: "/language:python"
          # Results appear in the GitHub Security tab (not just workflow logs)
          output: sarif-results
          upload: true

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run pip-audit
        run: pip-audit --format=json --output=audit-results.json || true
        # '|| true' prevents the workflow from failing here; we surface results as an artifact
        # so you can review them without blocking the build

      - name: Upload audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pip-audit-results
          path: audit-results.json
          retention-days: 30
